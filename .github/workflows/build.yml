name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ravenn_VST3 ravenn_Standalone ravennTest --parallel

      - name: Tests
        run: build\ravennTest_artefacts\Release\ravennTest.exe

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DBuildDir=$env:GITHUB_WORKSPACE\build\ravenn_artefacts\Release" packaging\windows\ravenn.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ravenn-windows
          path: packaging/windows/output/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target ravenn_VST3 ravenn_AU ravenn_Standalone ravennTest --parallel 4

      - name: Tests
        run: build/ravennTest_artefacts/Release/ravennTest

      - name: Package
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh build/ravenn_artefacts/Release dist

      - uses: actions/upload-artifact@v4
        with:
          name: ravenn-macos
          path: dist/*

      - name: Validation Audio Unit (auval)
        run: |
          sudo installer -pkg dist/ravenn-1.3.0-macos.pkg -target /
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Rvnn Rvnd
